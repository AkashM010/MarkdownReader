<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Your MD</title>
  <meta name="description" content="Read Your MD — a fast, beautiful Markdown reader and editor with live preview, diagrams, outline navigation, and in-place saving." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 21v-10l4 4.5 4-4.5v10' fill='none' stroke='%23071018' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 11v7m0 0l-3-3m3 3l3-3' fill='none' stroke='%23071018' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ===== Ambient background ===== -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-blob ambient-a"></div>
    <div class="ambient-blob ambient-b"></div>
    <div class="ambient-blob ambient-c"></div>
  </div>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5v-9l3.25 3.75L11 7.5v9" />
            <path d="M16.75 7.5v7m0 0-2.5-2.5m2.5 2.5 2.5-2.5" />
          </svg>
        </span>
        <span class="logo-name">Read Your<span class="logo-name-alt">MD</span></span>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="openBtn" title="Open .md file (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="action-label">Open</span>
      </button>
      <button class="action-btn primary" id="saveBtn" title="Save as .md file (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span class="action-label">Save</span>
      </button>
      <div class="header-separator"></div>
      <button class="action-btn icon-only" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button class="action-btn icon-only" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <div class="header-separator"></div>
      <span class="status-badge" id="wordCountHeader">0 words</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode (Ctrl+Shift+D)">
        <span class="toggle-flipper" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"/>
            <line x1="12" y1="1.5" x2="12" y2="3.5"/>
            <line x1="12" y1="20.5" x2="12" y2="22.5"/>
            <line x1="4.6" y1="4.6" x2="6" y2="6"/>
            <line x1="18" y1="18" x2="19.4" y2="19.4"/>
            <line x1="1.5" y1="12" x2="3.5" y2="12"/>
            <line x1="20.5" y1="12" x2="22.5" y2="12"/>
            <line x1="4.6" y1="19.4" x2="6" y2="18"/>
            <line x1="18" y1="6" x2="19.4" y2="4.6"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <div class="main-container">
    <!-- Left: Editor -->
    <div class="pane" id="editorPane">
      <div class="pane-header">
        <span class="pane-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Editor
        </span>
        <span class="pane-badge" id="fileNameBadge">untitled.md</span>
      </div>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
        <div class="tb-group">
          <div class="tb-dropdown">
            <button class="tb-btn" type="button" data-menu="heading" title="Heading" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><path d="M6 12h12"/></svg>
              <svg class="tb-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="tb-menu" role="menu">
              <button class="tb-menu-item tb-h1" type="button" role="menuitem" data-cmd="heading" data-arg="1">Heading 1</button>
              <button class="tb-menu-item tb-h2" type="button" role="menuitem" data-cmd="heading" data-arg="2">Heading 2</button>
              <button class="tb-menu-item tb-h3" type="button" role="menuitem" data-cmd="heading" data-arg="3">Heading 3</button>
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="heading" data-arg="0">Paragraph</button>
            </div>
          </div>
        </div>
        <div class="tb-sep"></div>
        <div class="tb-group">
          <button class="tb-btn" type="button" data-cmd="bold" title="Bold (Ctrl+B)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="italic" title="Italic (Ctrl+I)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="strike" title="Strikethrough (Alt+Shift+5)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="code" title="Inline code (Ctrl+E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
        <div class="tb-sep"></div>
        <div class="tb-group">
          <button class="tb-btn" type="button" data-cmd="quote" title="Quote (Ctrl+Shift+.)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="ul" title="Bullet list (Ctrl+Shift+8)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="ol" title="Numbered list (Ctrl+Shift+7)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="task" title="Task list (Ctrl+Shift+L)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
          </button>
        </div>
        <div class="tb-sep"></div>
        <div class="tb-group">
          <button class="tb-btn" type="button" data-cmd="link" title="Link (Ctrl+K)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="image" title="Image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="table" title="Table">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="codeblock" title="Code block">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m10 9-3 3 3 3"/><path d="m14 9 3 3-3 3"/></svg>
          </button>
          <button class="tb-btn" type="button" data-cmd="hr" title="Divider">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="8" y1="6" x2="16" y2="6" opacity="0.4"/><line x1="8" y1="18" x2="16" y2="18" opacity="0.4"/></svg>
          </button>
          <div class="tb-dropdown">
            <button class="tb-btn" type="button" data-menu="alert" title="Callout" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <svg class="tb-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="tb-menu" role="menu">
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="alert" data-arg="NOTE"><span class="tb-dot" style="--c:#3b82f6"></span>Note</button>
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="alert" data-arg="TIP"><span class="tb-dot" style="--c:#22c55e"></span>Tip</button>
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="alert" data-arg="IMPORTANT"><span class="tb-dot" style="--c:#8b5cf6"></span>Important</button>
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="alert" data-arg="WARNING"><span class="tb-dot" style="--c:#d97706"></span>Warning</button>
              <button class="tb-menu-item" type="button" role="menuitem" data-cmd="alert" data-arg="CAUTION"><span class="tb-dot" style="--c:#dc2626"></span>Caution</button>
            </div>
          </div>
          <button class="tb-btn" type="button" data-cmd="mermaid" title="Diagram (Mermaid)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg>
          </button>
        </div>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="editor" placeholder="Type your Markdown here..." spellcheck="false" wrap="off" autofocus></textarea>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider" id="divider" role="separator" aria-label="Resize panes"></div>

    <!-- Right: Preview -->
    <div class="pane" id="previewPane">
      <div class="pane-header">
        <span class="pane-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Preview
        </span>
        <span class="pane-header-right">
          <button class="pane-tool" id="outlineToggle" title="Toggle outline" aria-label="Toggle outline" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          </button>
          <span class="pane-badge status-chip" id="renderStatus" data-state="idle">Ready</span>
        </span>
      </div>
      <div class="pane-body">
        <div class="pane-content" id="previewContent">
          <div id="preview"></div>
        </div>
        <aside class="outline" id="outlinePanel" aria-label="Document outline">
          <div class="outline-inner">
            <div class="outline-title">Outline</div>
            <nav class="outline-list" id="outlineList"></nav>
          </div>
        </aside>
      </div>
      <span class="preview-loading" id="previewLoading" aria-hidden="true"></span>
    </div>
  </div>

  <!-- ===== Status Bar ===== -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-item">
        <span class="label">Ln</span>
        <span class="value" id="lineNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Col</span>
        <span class="value" id="colNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Chars</span>
        <span class="value" id="charCount">0</span>
      </span>
    </div>
    <div class="status-right">
      <span class="status-item">
        <span class="autosave-status" id="autosaveStatus"></span>
      </span>
      <span class="status-item">
        <span class="theme-dot" aria-hidden="true"></span>
        <span id="themeLabel">Dark</span>
      </span>
    </div>
  </div>

  <!-- ===== Hidden file input ===== -->
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,.mdown" style="display:none" />

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== Script entry ===== -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
