<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Markdown Reader</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="openBtn" title="Open .md file (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Open
      </button>
      <button class="action-btn" id="saveBtn" title="Save as .md file (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save
      </button>
      <div class="header-separator"></div>
      <button class="action-btn" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button class="action-btn" id="redoBtn" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <div class="header-separator"></div>
      <span class="status-badge" id="wordCountHeader">0 words</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode (Ctrl+Shift+D)">
        🌙
      </button>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <div class="main-container">
    <!-- Left: Editor -->
    <div class="pane" id="editorPane">
      <div class="pane-header">
        <span>Editor</span>
        <span class="pane-badge">Markdown</span>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="editor" placeholder="Type your Markdown here..." spellcheck="false" autofocus></textarea>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider" id="divider"></div>

    <!-- Right: Preview -->
    <div class="pane" id="previewPane">
      <div class="pane-header">
        <span>Preview</span>
        <span class="pane-badge" id="renderStatus">Ready</span>
      </div>
      <div class="pane-content" id="previewContent">
        <div id="preview"></div>
        <span class="preview-loading" id="previewLoading">Rendering...</span>
      </div>
    </div>
  </div>

  <!-- ===== Status Bar ===== -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-item">
        <span class="label">Ln</span>
        <span id="lineNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Col</span>
        <span id="colNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Chars</span>
        <span id="charCount">0</span>
      </span>
    </div>
    <div class="status-right">
      <span class="status-item">
        <span id="themeLabel">Dark</span>
      </span>
    </div>
  </div>

  <!-- ===== Hidden file input ===== -->
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,.mdown" style="display:none" />

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== Script entry ===== -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
