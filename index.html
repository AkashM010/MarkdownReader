<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 21v-10l4 4.5 4-4.5v10' fill='none' stroke='%23071018' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 11v7m0 0l-3-3m3 3l3-3' fill='none' stroke='%23071018' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ===== Ambient background ===== -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-blob ambient-a"></div>
    <div class="ambient-blob ambient-b"></div>
    <div class="ambient-blob ambient-c"></div>
  </div>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5v-9l3.25 3.75L11 7.5v9" />
            <path d="M16.75 7.5v7m0 0-2.5-2.5m2.5 2.5 2.5-2.5" />
          </svg>
        </span>
        <span class="logo-name">Markdown<span class="logo-name-alt">Reader</span></span>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="openBtn" title="Open .md file (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="action-label">Open</span>
      </button>
      <button class="action-btn" id="saveBtn" title="Save as .md file (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span class="action-label">Save</span>
      </button>
      <div class="header-separator"></div>
      <button class="action-btn icon-only" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button class="action-btn icon-only" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <div class="header-separator"></div>
      <span class="status-badge" id="wordCountHeader">0 words</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode (Ctrl+Shift+D)">
        <span class="toggle-flipper" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5"/>
            <line x1="12" y1="1.5" x2="12" y2="3.5"/>
            <line x1="12" y1="20.5" x2="12" y2="22.5"/>
            <line x1="4.6" y1="4.6" x2="6" y2="6"/>
            <line x1="18" y1="18" x2="19.4" y2="19.4"/>
            <line x1="1.5" y1="12" x2="3.5" y2="12"/>
            <line x1="20.5" y1="12" x2="22.5" y2="12"/>
            <line x1="4.6" y1="19.4" x2="6" y2="18"/>
            <line x1="18" y1="6" x2="19.4" y2="4.6"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <div class="main-container">
    <!-- Left: Editor -->
    <div class="pane" id="editorPane">
      <div class="pane-header">
        <span class="pane-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Editor
        </span>
        <span class="pane-badge" id="fileNameBadge">untitled.md</span>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="editor" placeholder="Type your Markdown here..." spellcheck="false" wrap="off" autofocus></textarea>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider" id="divider" role="separator" aria-label="Resize panes"></div>

    <!-- Right: Preview -->
    <div class="pane" id="previewPane">
      <div class="pane-header">
        <span class="pane-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Preview
        </span>
        <span class="pane-header-right">
          <button class="pane-tool" id="outlineToggle" title="Toggle outline" aria-label="Toggle outline" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          </button>
          <span class="pane-badge status-chip" id="renderStatus" data-state="idle">Ready</span>
        </span>
      </div>
      <div class="pane-body">
        <div class="pane-content" id="previewContent">
          <div id="preview"></div>
        </div>
        <aside class="outline" id="outlinePanel" aria-label="Document outline">
          <div class="outline-inner">
            <div class="outline-title">Outline</div>
            <nav class="outline-list" id="outlineList"></nav>
          </div>
        </aside>
      </div>
      <span class="preview-loading" id="previewLoading" aria-hidden="true"></span>
    </div>
  </div>

  <!-- ===== Status Bar ===== -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-item">
        <span class="label">Ln</span>
        <span class="value" id="lineNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Col</span>
        <span class="value" id="colNum">1</span>
      </span>
      <span class="status-item">
        <span class="label">Chars</span>
        <span class="value" id="charCount">0</span>
      </span>
    </div>
    <div class="status-right">
      <span class="status-item">
        <span class="autosave-status" id="autosaveStatus"></span>
      </span>
      <span class="status-item">
        <span class="theme-dot" aria-hidden="true"></span>
        <span id="themeLabel">Dark</span>
      </span>
    </div>
  </div>

  <!-- ===== Hidden file input ===== -->
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,.mdown" style="display:none" />

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== Script entry ===== -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
